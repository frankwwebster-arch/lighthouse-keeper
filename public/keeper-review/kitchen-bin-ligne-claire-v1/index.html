<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bin Ligne-Claire V1</title><style>body{margin:0;background:#f6e5b7;color:#051824;font:16px/1.45 system-ui}header,main{max-width:1320px;margin:auto;padding:22px}header{border-bottom:4px solid #051824}.status{display:inline-block;border:2px solid #051824;background:#e7a638;padding:6px 10px;font-weight:800}article{background:#fff9e8;border:2px solid #051824;margin:18px 0;padding:14px}img{display:block;width:100%;height:auto;image-rendering:auto}canvas{width:320px;height:320px;background:#eee6cf}</style></head><body><header><span class="status">IMMUTABLE CANDIDATE - NOT CURRENT</span><h1>Pedal bin Ligne-Claire V1</h1><p>Static object redraw only. Approved V31 miasma and fly loops remain byte-identical, separate, 40 frames at 4 fps.</p></header><main><article><img src="/keeper-review/kitchen-bin-ligne-claire-v1/assets/bin-current-candidate-ghost-64px.png"></article><article><h2>Broken candidate with unchanged animated overlays</h2><canvas id="preview" width="80" height="80"></canvas></article></main><script>const base='/keeper-review/kitchen-bin-ligne-claire-v1/assets/',files=['candidate--bin-broken-overflowing.png','fx-stench-miasma-f40.png','fx-slow-flies-f40.png'],images={},canvas=document.getElementById('preview'),ctx=canvas.getContext('2d');Promise.all(files.map(name=>new Promise((ok,no)=>{const i=new Image;i.onload=async()=>{try{await i.decode()}catch{}images[name]=i;ok()};i.onerror=no;i.src=base+name}))).then(()=>{const start=performance.now();function frame(t){const n=Math.floor((t-start)/250)%40;ctx.clearRect(0,0,80,80);ctx.drawImage(images[files[0]],0,8);ctx.drawImage(images[files[1]],n*80,0,80,80,0,0,80,80);ctx.drawImage(images[files[2]],n*80,0,80,80,0,0,80,80);requestAnimationFrame(frame)}requestAnimationFrame(frame)})</script></body></html>
