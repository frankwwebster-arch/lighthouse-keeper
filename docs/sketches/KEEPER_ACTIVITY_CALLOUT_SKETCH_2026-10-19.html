<style id="page-style">
/* Layout: the project page's log-book column; the moving stage is the one raised object, everything else is flat ruled sections. */
:root{
  --bg:#edf2f6; --card:#ffffff; --ink:#14243a; --muted:#56667b; --rule:#c9d4df;
  --red:#b8402f; --red-soft:#f6e3df; --sea:#2b6a96; --sea-soft:#dde9f3; --lamp:#c48a0a; --lamp-soft:#fbf0d2;
  --display:"Pixelify Sans","Courier New",monospace; --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1828; --card:#142236; --ink:#e6edf6; --muted:#9fb0c4; --rule:#2c3e57;
  --red:#ee7d6c; --red-soft:#3b211f; --sea:#7fb6e0; --sea-soft:#17304a; --lamp:#f0c24f; --lamp-soft:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1828; --card:#142236; --ink:#e6edf6; --muted:#9fb0c4; --rule:#2c3e57;
  --red:#ee7d6c; --red-soft:#3b211f; --sea:#7fb6e0; --sea-soft:#17304a; --lamp:#f0c24f; --lamp-soft:#3a2f12; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
#app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--sea)}
code{font-size:.86em;background:var(--sea-soft);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
header{display:flex;flex-direction:column;gap:10px}
.lede{color:var(--muted);max-width:64ch}
section{display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--ink);padding-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:5px 11px;border-radius:3px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--sea)}
.chip:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.static{cursor:default}
.chip.go{background:var(--sea-soft);border-color:var(--sea)}
.dot{width:8px;height:8px;background:var(--sea);display:inline-block}
.ctl-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:6px}

/* The stage: the one raised object */
.stagecard{background:var(--card);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--red);padding:16px;display:flex;flex-direction:column;gap:16px}
.stagewrap{overflow-x:auto;display:flex;justify-content:center}
.stage{position:relative;width:360px;height:330px;transform-origin:0 0;flex:none}
.stagebox{flex:none;position:relative;border:2px solid var(--ink)}
.stage > *{position:absolute;left:0;top:0}
#keeper{left:116px;top:158px;width:128px;height:160px;transform-origin:50% 100%}
.stagenote{font-size:.9rem;color:var(--muted);text-align:center}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}

/* The phrase chart */
#timeline{width:100%;height:auto;display:block}
#timeline text{fill:var(--muted);font-family:var(--body)}
#timeline .row-label{fill:var(--ink);font-weight:700}
#timeline .bar{fill:var(--sea)}
#timeline .bar.main{fill:var(--red)}
#timeline .bar.env{fill:var(--lamp)}
#timeline .grid{stroke:var(--rule);stroke-width:1}
#timeline .quiet{fill:var(--lamp-soft)}
#timeline .head{stroke:var(--ink);stroke-width:2}

/* Questions */
.q{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.q:last-of-type{border-bottom:0}
.qhead{display:flex;gap:12px;align-items:baseline}
.qnum{font-family:var(--display);font-size:1.1rem;color:var(--red);flex:none}
.why{color:var(--muted);font-size:.92rem}
.opts{display:grid;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--rule);border-radius:4px;background:var(--card);color:var(--ink);font-size:.95rem}
.opt:hover{border-color:var(--sea)}
.opt:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.opt .box{flex:none;width:14px;height:14px;border:2px solid var(--muted);margin-top:4px}
.opt[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.opt[aria-pressed="true"] .box{background:var(--sea);border-color:var(--sea)}
.opt b{display:block}
.opt .d{color:var(--muted);font-size:.88rem}
.rec{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--sea);margin-left:6px}
label.note{font-size:.85rem;color:var(--muted);font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:56px;font:inherit;font-size:.95rem;padding:8px 10px;border:1.5px solid var(--rule);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus-visible{outline:3px solid var(--lamp);outline-offset:1px}
.savebar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1rem;padding:10px 18px;background:var(--red);color:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.quiet{background:var(--card);color:var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.btn[disabled]{opacity:.5;cursor:default}
.status{font-size:.9rem;color:var(--muted)}

/* Lists */
ol.ideas{margin:0;padding-left:1.5rem;display:flex;flex-direction:column;gap:12px}
ol.ideas li{padding-left:4px}
ol.ideas .d{color:var(--muted);font-size:.95rem;max-width:68ch}
.handback{display:grid;grid-template-columns:8rem 1fr;gap:6px 14px;margin:0}
.handback dt{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-top:3px}
.handback dd{margin:0;min-width:0}
@media (max-width:520px){.handback{grid-template-columns:1fr}.handback dd{margin-bottom:6px}}
pre.brief{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;line-height:1.5;background:var(--card);border:1.5px solid var(--rule);border-radius:4px;padding:14px;max-height:420px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <span class="eyebrow">Lighthouse Keeper · sketch for Codex · 19 Oct</span>
  <h1>Keeper Activity Callout</h1>
  <p class="lede">The Prime Keeper works with his back to us, and a flurry of little pictures above his head says what he’s doing. Pick an activity to see the same body loop tell six different stories.</p>
  <dl class="handback">
    <dt>Preflight</dt><dd><span class="chip static go"><span class="dot"></span>GREEN · built</span></dd>
    <dt>Goal</dt><dd>A moving sketch of the back-work loop with its activity callout, for you to choose a look and hand to Codex.</dd>
    <dt>Done when</dt><dd>You’ve answered below and sent Codex the brief at the bottom.</dd>
    <dt>Not included</dt><dd>Real Keeper art (Codex owns it), game code and sounds.</dd>
    <dt>Size</dt><dd>One step, low complexity; the current model is fine.</dd>
    <dt>Fits with</dt><dd>Codex wrote a brief for this today (<code>docs/KEEPER_BACK_WORK_ACTIVITY_CALLOUT_BRIEF_2026-10-19.md</code>). This sketch follows it, except that it leads with the bubble-free comic look from the picture you sent.</dd>
  </dl>
</header>

<section>
  <h2>Ideas for keeping the Keeper consistent</h2>
  <p class="why">You asked how to make this less painful. You’re already doing the biggest one: one body that serves many jobs. These go with it.</p>
  <ol class="ideas">
    <li><b>Fewer bodies, more layers.</b><div class="d">Aim for a small bank of body performances (working at a counter with his back to us, sitting, carrying, walking) and let the callout, the furniture and the sound say what’s really happening. Every body you don’t draw is one that can’t drift.</div></li>
    <li><b>Raise the job, not the keeper.</b><div class="d">If raised planters, a pet-bowl shelf and the like are all drawn at counter height, the one standing back-work loop covers gardening and feeding too. Question 3 asks about this.</div></li>
    <li><b>Copy what shouldn’t move, don’t redraw it.</b><div class="d">In a standing loop his legs and boots never change. After each frame is generated, Codex can paste those exact pixels from the Prime drawing back in by script. This isn’t splitting him into parts: it stamps back the bits that are meant to be identical, so only the moving part can ever differ.</div></li>
    <li><b>Lock the colours.</b><div class="d">Have Codex snap every frame to the Prime palette (the exact blues, the cream band, the beard). Small colour shifts are what make a jumper seem to flicker between frames.</div></li>
    <li><b>Short loops, held frames.</b><div class="d">Four to six frames at 4 per second is plenty for a back view. Fewer frames means fewer chances to drift. The callout supplies the liveliness instead.</div></li>
    <li><b>Hide the hard parts on purpose.</b><div class="d">Faces and hands drift most. A back view hides his face, and his body hides his hands as he works at the counter, the way your cupboard idea hides him in the doorway.</div></li>
  </ol>
</section>

<section>
  <h2>What’s fake in this sketch</h2>
  <dl class="handback">
    <dt>His body</dt><dd>It’s the approved Prime rear drawing, tilted a little in time with the game’s 4 frames per second. Codex draws the real arm-and-shoulder loop.</dd>
    <dt>The pictures</dt><dd>Quick drawings of my own, for the idea only. Codex makes pixel versions in the game’s style.</dd>
    <dt>The furniture</dt><dd>Placeholder shapes at the real counter height (19 of his 40 pixels), standing against the wall behind him. He faces it, so his own back hides his hands.</dd>
    <dt>The timings</dt><dd>A starting point. Codex should tune them at the real size on an iPad.</dd>
  </dl>
</section>

  else{
    els.swirls.forEach(function(s){var k=+s.dataset.k,sc=env*(1+0.12*Math.sin(t*5+k*1.7));s.setAttribute('transform','translate('+s.dataset.x+' '+s.dataset.y+') rotate('+((t*140+k*80)%360).toFixed(0)+') scale('+Math.max(sc,0.0001).toFixed(3)+')');s.setAttribute('opacity',env>0.02?1:0)});
    els.flicks.forEach(function(f){var k=+f.dataset.k,p=((t*1.6+k*0.37)%1),r=44+p*30,q=fanPos(+f.dataset.a,r);f.setAttribute('transform','translate('+q[0].toFixed(1)+' '+q[1].toFixed(1)+') rotate('+(+f.dataset.a+90)+') scale('+(1.2-0.4*p).toFixed(2)+')');f.setAttribute('opacity',(env*(1-p)).toFixed(2))});
  }

  /* Main picture: pops in first, bobs with his shoulders, leaves last. */
  var mh2=mainHome(),ms=0,my=0,mr=0;
  if(t>=MAIN_IN&&t<MAIN_OUT+0.3){
    ms=t<MAIN_IN+0.3?backOut((t-MAIN_IN)/0.3):t<MAIN_OUT?1:1-easeIn((t-MAIN_OUT)/0.3);
    my=-4*Math.abs(Math.sin(Math.PI*2*bt));mr=7*Math.sin(t*4.4);
  }
  setIcon(els.main,A.main,ms>0,mh2[0],mh2[1]+my,mr,ms,1);
  var bi=0;
  if(t>=MAIN_IN&&t<MAIN_IN+0.28)setBurst(els.bursts[bi++],true,mh2[0],mh2[1],(t-MAIN_IN)/0.28,26);

  /* Helpers: staggered entrances, a moment of life, then out. */
  var H=hs.length;
  for(var i=0;i<4;i++){
    var h=hs[i],g=els.helpers[i];
    if(!h||t<h.s||t>=h.e){setIcon(g,'',false);continue}
    var name=A.support[(n*H+i)%A.support.length];
    var u=t-h.s,en=clamp(u/0.4,0,1),ex=clamp((t-(h.e-0.35))/0.35,0,1),live=u-0.4;
    var home=helperHome(i,h.m),x=home[0],y=home[1],r=0,s=1,op=1;
    if(fan){
      /* Flicked out from his head along its spoke, overshooting, then jiggling. */
      var a=FAN_ANG[i]*Math.PI/180,rr=lerp(30,i<2?98:92,backOut(en));
      x=HEAD.x+rr*Math.cos(a);y=HEAD.y+rr*Math.sin(a);
      r=(FAN_ANG[i]+90)*0.35+(live>0?9*Math.sin(live*9+i):0);
      s=0.4+0.6*backOut(en);
      if(live>0)y-=4*Math.abs(Math.sin(Math.PI*2.4*live));
      if(ex>0){s*=1-0.6*ex;op=1-ex;x+=Math.cos(a)*14*ex;y+=Math.sin(a)*14*ex}
    }else if(h.m==='arc'){
      x=lerp(C.x-14,home[0],en);y=lerp(C.y+96,home[1],en)-44*Math.sin(Math.PI*en);r=-40*(1-en);
      if(live>0){y-=7*Math.abs(Math.sin(Math.PI*2.4*live));r=8*Math.sin(live*7)}
      if(ex>0){x-=30*ex;y-=36*ex;op=1-ex;s=1-0.5*ex}
    }else if(h.m==='drop'){
      y=lerp(C.y-36,home[1],bounceOut(en));
      if(live>0)r=13*Math.sin(live*7);
      if(ex>0){s=1+0.4*ex;op=1-ex}
    }else if(h.m==='orbit'){
      var th=Math.PI+Math.PI*2*0.7*u;x=home[0]+48*Math.cos(th);y=home[1]+26*Math.sin(th);s=backOut(en)*(1-ex);r=10*Math.sin(u*6);
    }else{
      s=backOut(en);if(live>0)y-=6*Math.abs(Math.sin(Math.PI*2.6*live));if(ex>0){y-=24*ex;op=1-ex}
    }
    setIcon(g,name,true,x,y,r,s,op);
    var land=h.s+(fan||h.m==='arc'||h.m==='drop'?0.32:0.05);
    if(t>=land&&t<land+0.26&&bi<5)setBurst(els.bursts[bi++],true,x,y,(t-land)/0.26,20);
  }
  return {t:t};
}

/* ---------- Body loop placeholder: the Prime rear drawing tilted at 4 fps ---------- */
var keeper=document.getElementById('keeper');
var POSE=[[0,1,0],[-1.4,0.985,-1],[0,1,0],[1.4,0.985,-1]];
function renderBody(T){var f=Math.floor(T*4)%4,p=POSE[f];keeper.style.transform='translateY('+p[2]+'px) rotate('+p[0]+'deg) scaleY('+p[1]+')'}

/* ---------- Timeline chart ---------- */
var tl=document.getElementById('timeline'),TL={x0:118,w:390,row:22,top:12};
function tx(t){return TL.x0+t/L*TL.w}
function drawTimeline(){
  var hs=PHR[view.busy],A=act(),rows=[{l:view.style==='fan'?'Swirls and flicks':'Cloud',s:0,e:ENV_GONE,c:'env'},{l:'Main: '+NAMES[A.main],s:MAIN_IN,e:MAIN_OUT+0.3,c:'main'}];
  hs.forEach(function(h,i){rows.push({l:'Helper '+(i+1),s:h.s,e:h.e,c:''})});
  var H=TL.top+rows.length*TL.row+30,o='';
  o+='<rect class="quiet" x="'+tx(ENV_GONE)+'" y="'+(TL.top-4)+'" width="'+(tx(L)-tx(ENV_GONE))+'" height="'+(rows.length*TL.row+4)+'"/>';
  o+='<text x="'+((tx(ENV_GONE)+tx(L))/2)+'" y="'+(TL.top+rows.length*TL.row/2+4)+'" font-size="11" text-anchor="middle">quiet</text>';
  for(var s=0;s<=5;s++){o+='<line class="grid" x1="'+tx(s)+'" x2="'+tx(s)+'" y1="'+(TL.top-4)+'" y2="'+(TL.top+rows.length*TL.row)+'"/><text x="'+tx(s)+'" y="'+(TL.top+rows.length*TL.row+16)+'" font-size="11" text-anchor="middle">'+s+' s</text>'}
  rows.forEach(function(r,i){var y=TL.top+i*TL.row;o+='<text class="row-label" x="0" y="'+(y+13)+'" font-size="12">'+esc(r.l)+'</text><rect class="bar '+r.c+'" x="'+tx(r.s)+'" y="'+(y+3)+'" width="'+(tx(r.e)-tx(r.s))+'" height="12" rx="2"/>'});
  o+='<line id="playhead" class="head" x1="'+tx(0)+'" x2="'+tx(0)+'" y1="'+(TL.top-6)+'" y2="'+(TL.top+rows.length*TL.row+2)+'"/>';
  tl.setAttribute('viewBox','0 0 520 '+H);tl.innerHTML=o;
}

/* ---------- Scene + controls ---------- */
function drawScene(){
  var A=act();
  document.getElementById('bg').innerHTML=drawBg(A);
  document.getElementById('fg').innerHTML=drawFg(A);
  var sup=A.support.map(function(k){return NAMES[k]});
  document.getElementById('stagenote').textContent=A.label+': the '+NAMES[A.main]+' leads, with '+sup.slice(0,-1).join(', ')+' and '+sup[sup.length-1]+' taking turns.';
  drawTimeline();
}
function chipRow(id,items,isOn,onPick){
  var el=document.getElementById(id);
  el.innerHTML=items.map(function(it){return '<button type="button" class="chip" data-v="'+it.id+'" aria-pressed="'+(isOn(it.id)?'true':'false')+'">'+esc(it.label)+'</button>'}).join('');
  el.onclick=function(e){var b=e.target.closest('button');if(!b)return;onPick(b.dataset.v);renderControls()};
}
function renderControls(){
  chipRow('act-tabs',ACTS,function(v){return v===view.act},function(v){view.act=v;T=0;drawScene()});
  chipRow('style-tabs',STYLES,function(v){return v===view.style},function(v){view.style=v;drawTimeline()});
  chipRow('busy-tabs',BUSY,function(v){return v===view.busy},function(v){view.busy=v;drawTimeline()});
  chipRow('play-tabs',[{id:'pause',label:view.paused?'Play':'Pause'},{id:'next',label:'Next phrase'},{id:'steps',label:'Choppy, game-style'},{id:'calm',label:'Still version'},{id:'zoom',label:'Twice the size'}],
    function(v){return (v==='steps'&&view.steps)||(v==='calm'&&view.calmMotion)||(v==='zoom'&&view.zoom===2)||(v==='pause'&&view.paused)},
    function(v){if(v==='pause')view.paused=!view.paused;if(v==='next')T=(Math.floor(T/L)+1)*L;if(v==='steps')view.steps=!view.steps;if(v==='calm')view.calmMotion=!view.calmMotion;if(v==='zoom'){view.zoom=view.zoom===2?1:2;applyZoom()}});
  chipRow('layer-tabs',[{id:'keeper',label:'Keeper'},{id:'fg',label:'Furniture'},{id:'callout',label:'Callout'}],function(v){return view.layers[v]},function(v){view.layers[v]=!view.layers[v];applyLayers()});
}
function applyZoom(){var z=view.zoom,st=document.getElementById('stage'),bx=document.getElementById('stagebox');st.style.transform='scale('+z+')';bx.style.width=(360*z)+'px';bx.style.height=(330*z)+'px'}
function applyLayers(){keeper.style.visibility=view.layers.keeper?'visible':'hidden';document.getElementById('fg').style.visibility=view.layers.fg?'visible':'hidden';callout.style.visibility=view.layers.callout?'visible':'hidden'}

var T=0,last=null;
function tick(now){
  if(last==null)last=now;var dt=Math.min((now-last)/1000,0.1);last=now;
  if(!view.paused)T+=dt;
  renderBody(T);var r=renderCallout(T);
  var ph=document.getElementById('playhead');if(ph){var x=tx(r.t);ph.setAttribute('x1',x);ph.setAttribute('x2',x)}
  requestAnimationFrame(tick);
}

/* ---------- Questions ---------- */
var QUESTIONS=[
 {id:'style',q:'Which look for the callout?',why:'Your picture shows symbols fanned over a head with swirls and flicks, and no bubble. Codex’s brief suggested a small cloud. Both are in the sketch.',opts:[
   {v:'fan',t:'Fan over his head',d:'Pictures flick out from his head in an arc, with spinning swirls and little flicks, like your comic picture. No bubble, so it can never be mistaken for his wants bubble later.',rec:true,preview:{style:'fan'}},
   {v:'cloud',t:'Cloud puff',d:'Pictures hop about inside a small cloud beside his head. Tidier against busy rooms, but closer to a thought bubble.',preview:{style:'cloud'}}]},
 {id:'busy',q:'How busy should it be?',why:'More pictures tell more of the story, but at iPad size too many become hard to read.',opts:[
   {v:'calm',t:'Calm',d:'The main picture plus one helper at a time.',preview:{busy:'calm'}},
   {v:'lively',t:'Lively',d:'The main picture plus up to two helpers.',rec:true,preview:{busy:'lively'}},
   {v:'busy',t:'Busy',d:'The main picture plus up to four, closest to your picture.',preview:{busy:'busy'}}]},
 {id:'low',q:'Jobs low down (picking tomatoes, feeding the cat, weeding)?',why:'His hands are at counter height in this loop.',opts:[
   {v:'raise',t:'Raise the job, not the keeper',d:'Draw raised planters, a pet-bowl shelf and so on at counter height, so this one standing loop covers everything.',rec:true,preview:{act:'tomatoes'}},
   {v:'crouch',t:'Add a crouching version later',d:'A second back-facing loop, low down. One more animation to keep consistent.'}]}
];
function answer(id){return state.answers[id]||(state.answers[id]={choice:'',note:''})}
function renderQuestions(){
  var h='';
  QUESTIONS.forEach(function(q,i){
    var a=state.answers[q.id]||{};
    h+='<div class="q" data-q="'+q.id+'"><div class="qhead"><span class="qnum">'+(i+1)+'</span><div><h3>'+esc(q.q)+'</h3><p class="why">'+esc(q.why)+'</p></div></div><div class="opts">';
    q.opts.forEach(function(o){h+='<button type="button" class="opt" data-v="'+o.v+'" aria-pressed="'+(a.choice===o.v?'true':'false')+'"><span class="box"></span><span><b>'+esc(o.t)+(o.rec?'<span class="rec">Recommended</span>':'')+'</b><span class="d">'+esc(o.d)+'</span></span></button>'});
    h+='</div><label class="note" for="note-'+q.id+'">Anything to add?</label><textarea id="note-'+q.id+'" data-note="'+q.id+'">'+esc(a.note||'')+'</textarea></div>';
  });
  var other=state.answers.other||{};
  h+='<div class="q"><div class="qhead"><span class="qnum">4</span><div><h3>Anything else for Codex?</h3><p class="why">Other activities you want pictures for, things you’d change, anything at all.</p></div></div><label class="note" for="note-other">Your note</label><textarea id="note-other" data-note="other">'+esc(other.note||'')+'</textarea></div>';
  var el=document.getElementById('questions');el.innerHTML=h;
  el.onclick=function(e){var b=e.target.closest('.opt');if(!b)return;var qid=b.closest('.q').dataset.q,a=answer(qid);a.choice=a.choice===b.dataset.v?'':b.dataset.v;
    var q=QUESTIONS.filter(function(x){return x.id===qid})[0],o=q.opts.filter(function(x){return x.v===b.dataset.v})[0];
    if(a.choice&&o.preview){if(o.preview.style)view.style=o.preview.style;if(o.preview.busy)view.busy=o.preview.busy;if(o.preview.act&&view.act!==o.preview.act){view.act=o.preview.act;T=0;drawScene()}drawTimeline();renderControls()}
    [].forEach.call(b.parentNode.children,function(x){x.setAttribute('aria-pressed',x.dataset.v===a.choice?'true':'false')});
    dirty();};
  el.oninput=function(e){var k=e.target.dataset.note;if(!k)return;answer(k).note=e.target.value;dirty()};
}
function dirty(){keepDraft();renderBrief();setStatus('Not saved yet.')}
function setStatus(s){document.getElementById('status').textContent=s}

/* ---------- Brief ---------- */
function pick(id){var a=state.answers[id]||{},q=QUESTIONS.filter(function(x){return x.id===id})[0];var o=q&&q.opts.filter(function(x){return x.v===a.choice})[0];return {t:o?o.t:'not chosen yet',note:a.note||''}}
function renderBrief(){
  var s=pick('style'),b=pick('busy'),l=pick('low'),other=(state.answers.other||{}).note||'';
  var lines=[
'Lighthouse Keeper: activity callout for the Prime rear-work loop',
'',
'Read first',
'- Your brief: docs/KEEPER_BACK_WORK_ACTIVITY_CALLOUT_BRIEF_2026-10-19.md',
'- Frank\'s moving sketch: '+(PAGE_URL.indexOf('http')===0?PAGE_URL:'(link on Frank\'s page)'),
'',
'What changes from your brief',
'- Frank prefers a bubble-free comic look (he shared a comic panel as',
'  reference): pictures flick out from the Keeper\'s head and hang in an',

'  spiral swirls between them and little teardrop flicks shooting out from',
'  the head. Draw everything in our own style; do not copy the reference.',
'- The cloud puff stays as the alternative. No bubble means it can never',

'',
'Frank\'s choices',
'- Look: '+s.t+(s.note?'. Note: '+s.note:''),
'- How busy: '+b.t+(b.note?'. Note: '+b.note:''),
'- Low jobs: '+l.t+(l.note?'. Note: '+l.note:''),
other?'- Other: '+other:'- Other: none',
'',
'Grammar shown in the sketch (one phrase = 5.2 s, then it repeats)',
'- 0.00-0.35 s  swirls and flicks (or the cloud) swell in.',
'- 0.35 s       main picture pops in at the top of the arc with a burst of',
'               short lines, then bobs in time with his shoulders.',
'- 0.9 s on     helpers flick out one at a time onto their spokes, jiggle,',

ACTS.map(function(a){return '- '+a.label+': '+NAMES[a.main]+'; '+a.support.map(function(k){return NAMES[k]}).join(', ')}).join('\n'),

'- The callout starts once he reaches the work pose and ends before he',
'  turns away.',
'- Drafts only: approve, promote or wire nothing. Run the gates in order,',

  ];
  document.getElementById('brief').textContent=lines.join('\n');
}
document.getElementById('copy').onclick=function(){
  var txt=document.getElementById('brief').textContent,st=document.getElementById('copystatus');
  function fallback(){var r=document.createRange();r.selectNodeContents(document.getElementById('brief'));var sel=getSelection();sel.removeAllRanges();sel.addRange(r);st.textContent='Selected. Press Cmd+C to copy.'}
  try{navigator.clipboard.writeText(txt).then(function(){st.textContent='Copied.'},fallback)}catch(e){fallback()}
};

/* ---------- Save: republish the page with the answers inside ---------- */
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return SKELETON_OPEN+'<title>'+TITLE+'</title>\n'+FONT_LINK+'\n'+document.getElementById('page-style').outerHTML+'\n'+document.getElementById('page-body').outerHTML+'\n<div id="app"></div>\n<script type="application/json" id="answers">'+json+'</'+'script>\n'+document.getElementById('page-code').outerHTML+'\n</body></html>';
}
var saveBtn=document.getElementById('save'),artifact=null;
saveBtn.onclick=async function(){
  saveBtn.disabled=true;setStatus('Saving…');
  try{
    if(!artifact&&window.claude&&window.claude.use)artifact=await window.claude.use('artifact');
    if(!artifact){setStatus('Saving isn’t available in this view. Open the page on claude.ai to save.');saveBtn.disabled=false;return}
    state.savedAt=new Date().toISOString();keepDraft();
    await artifact.publish(buildDoc());
    setStatus('Saved. Say “handed back” when you’re ready.');
  }catch(e){
    var c=e&&e.code;
    setStatus(c==='conflict'?'A newer version was saved elsewhere; the page will reload with it.':(c==='not_granted'||c==='not_writer')?'You can view this page but not save to it.':'That didn’t save. Try again in a moment.');
    saveBtn.disabled=false;
  }
};
if(state.savedAt)setStatus('Last saved '+new Date(state.savedAt).toLocaleString()+'.');

buildCallout();renderControls();drawScene();applyZoom();applyLayers();renderQuestions();renderBrief();
requestAnimationFrame(tick);
})();
</script>
